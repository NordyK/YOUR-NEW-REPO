[package]
name = "engine-replay"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
engine-amm = { path = "../engine-amm" }
engine-feed = { path = "../engine-feed" }
engine-state = { path = "../engine-state" }
engine-routes = { path = "../engine-routes" }
engine-detect = { path = "../engine-detect" }
engine-sim = { path = "../engine-sim" }
engine-revm = { path = "../engine-revm" }
engine-gas = { path = "../engine-gas" }
engine-submit = { path = "../engine-submit" }
engine-sysopt = { path = "../engine-sysopt" }
ruint = { workspace = true }
thiserror = { workspace = true }
crossbeam-utils = { workspace = true }
base64-simd = { workspace = true }

[dev-dependencies]
# Hot-path zero-allocation gate (§18.7): the test installs `CountingAllocator<MiMalloc>` as the
# test binary's global allocator, warms up the ReplayDriver hot path, arms, then measures
# steady-state per-frame allocations. Dev-only — does not affect the production binary.
engine-metrics = { path = "../engine-metrics" }
mimalloc = { workspace = true }

[lints]
workspace = true
