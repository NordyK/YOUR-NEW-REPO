<!doctype html>
<html><head><meta charset="utf-8"><title>Animals test</title>
<style>
  html,body{margin:0;background:#9fb4c4;overflow:hidden;font:12px/1.2 system-ui,sans-serif}
  canvas{display:block}
  .lab{position:absolute;color:#102030;font-weight:600;transform:translate(-50%,0);white-space:nowrap;text-shadow:0 0 3px #fff}
</style></head>
<body>
<script type="module">
import { THREE, createAnimal, FLYING, MARINE } from './js/animals3d.js';
const Q = new URLSearchParams(location.search);
const IDS = (Q.get('only') || 'african-elephant,woolly-mammoth,lion,tiger,giraffe,zebra,cheetah,jaguar,snow-leopard,gorilla,orangutan,giant-panda,polar-bear,brown-bear,gray-wolf,thylacine,american-bison,hippopotamus,white-rhino,dromedary,moose,emperor-penguin,bald-eagle,ostrich,dodo,blue-whale,humpback-whale,orca,bottlenose-dolphin,great-white-shark,green-sea-turtle,saltwater-crocodile,komodo-dragon,king-cobra,monarch-butterfly,red-kangaroo,koala').split(',');
const view = Q.get('view') || 'q';       // q = 3/4, side, top, front
const T = Q.has('t') ? +Q.get('t') : null;
const cols = +(Q.get('cols') || Math.ceil(Math.sqrt(IDS.length * 1.4 * innerWidth / innerHeight / 1.4)));
const appLight = Q.get('light') !== 'studio';
const W = innerWidth, H = innerHeight;
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setSize(W, H);
renderer.setPixelRatio(1);
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color('#9fb4c4');
if (appLight) {
  scene.add(new THREE.AmbientLight(0xcccccc, Math.PI));
  const d = new THREE.DirectionalLight(0xffffff, 0.6 * Math.PI); d.position.set(0.4, 1, 0.6); scene.add(d);
} else {
  scene.add(new THREE.HemisphereLight(0xdfefff, 0x6a5a40, 1.6));
  const d = new THREE.DirectionalLight(0xffffff, 2.2); d.position.set(0.5, 1, 0.8); scene.add(d);
}
const rows = Math.ceil(IDS.length / cols);
const cw = Math.floor(W / cols), ch = Math.floor(H / rows);
const cam = new THREE.PerspectiveCamera(Q.has('fov') ? +Q.get('fov') : 30, cw / ch, 0.05, 50);
const dirs = { q: [0.55, 0.45, 1], side: [0, 0.08, 1], top: [0.15, 1.6, 0.6], front: [1, 0.2, 0.3], back: [-0.6, 0.4, 1] };
const dv = new THREE.Vector3(...dirs[view]).normalize();
const ground = new THREE.Mesh(new THREE.CircleGeometry(0.75, 32), new THREE.MeshStandardMaterial({ color: '#8aa07a', roughness: 1 }));
ground.rotation.x = -Math.PI / 2; ground.position.y = -0.002;
if (Q.get('ground') !== '0') scene.add(ground);
const insts = [];
const t0 = performance.now();
let tris = [];
for (let i = 0; i < IDS.length; i++) {
  const id = IDS[i];
  try {
    const a = await createAnimal(id);
    const g = new THREE.Group();
    g.add(a.object);
    if (FLYING.has(id)) a.object.position.y = 0.3;
    g.visible = false;
    scene.add(g);
    let n = 0; a.object.traverse(o => { if (o.isMesh) { const gg = o.geometry; n += (gg.index ? gg.index.count : gg.attributes.position.count) / 3; } });
    tris.push(id + ':' + Math.round(n));
    insts.push({ id, a, g, i });
    const el = document.createElement('div'); el.className = 'lab'; el.textContent = id;
    el.style.left = ((i % cols) * cw + cw / 2) + 'px'; el.style.top = (Math.floor(i / cols) * ch + 4) + 'px';
    document.body.appendChild(el);
  } catch (e) { console.log('ERR', id, e.message, e.stack); }
}
console.log('build ms', Math.round(performance.now() - t0));
console.log('tris', tris.join(' '));
renderer.setScissorTest(true);
const zoom = +(Q.get('zoom') || 1);
const start = performance.now();
function loop() {
  const t = T != null ? T : (performance.now() - start) / 1000;
  renderer.setScissor(0, 0, W, H); renderer.setViewport(0, 0, W, H); renderer.clear();
  for (const it of insts) {
    it.a.update(t, 1 / 60);
    it.g.visible = true;
    const c = it.i % cols, r = Math.floor(it.i / cols);
    const x = c * cw, y = H - (r + 1) * ch;
    renderer.setScissor(x, y, cw, ch); renderer.setViewport(x, y, cw, ch);
    const sz = it.a.object.userData.size || new THREE.Vector3(1, 1, 1);
    const ctr = new THREE.Vector3(0, (FLYING.has(it.id) ? 0.3 : 0) + sz.y * 0.5, 0);
    cam.position.copy(ctr).addScaledVector(dv, 2.9 / zoom);
    cam.lookAt(ctr);
    ground.visible = !FLYING.has(it.id);
    renderer.render(scene, cam);
    it.g.visible = false;
  }
  if (T == null) requestAnimationFrame(loop);
}
renderer.autoClear = false; renderer.setClearColor("#9fb4c4");
loop();
// perf probe: 40 instances update time
const tp = performance.now();
for (let k = 0; k < 20; k++) insts.forEach(it => it.a.update(k * 0.05, 0.05));
console.log('update ms per frame for all', ((performance.now() - tp) / 20).toFixed(2));
</script>
</body></html>
